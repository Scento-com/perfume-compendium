[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scento-perfume-api"
version = "1.0.0"
description = "Scento Perfume API: a free perfume and fragrance API and MCP server over Scento's verified perfume database. Perfume portraits, notes, raw materials, houses and families, every answer tied to a page on scento.com. No key, no account."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scento", email = "contact@scento.com" }]
keywords = ["perfume api", "fragrance api", "perfume database", "perfume mcp", "mcp server", "mcp", "model-context-protocol", "perfume", "fragrance", "perfume-notes", "claude", "chatgpt", "scento"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://www.scento.com/developers"
Documentation = "https://www.scento.com/developers"
Website = "https://www.scento.com"
Repository = "https://github.com/Scento-com/perfume-mcp-server"
Issues = "https://github.com/Scento-com/perfume-mcp-server/issues"

[project.scripts]
scento-perfume-api = "scento_perfume_api.proxy:main"

[tool.setuptools.packages.find]
where = ["src"]
