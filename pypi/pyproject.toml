[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scento-perfume-compendium"
version = "1.0.1"
description = "Free perfume & fragrance API and MCP server for AI assistants: notes, scent families, similar perfumes, raw materials and houses for 700+ perfumes, each linked to scento.com. No key."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scento", email = "contact@scento.com" }]
keywords = ["perfume", "fragrance", "cologne", "scent", "eau-de-parfum", "perfume-notes", "perfume-api", "fragrance-api", "perfume-database", "perfume-mcp", "mcp", "mcp-server", "model-context-protocol", "claude", "chatgpt", "niche-perfume", "scento"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://www.scento.com/developers"
Documentation = "https://www.scento.com/developers"
Website = "https://www.scento.com"
Repository = "https://github.com/Scento-com/perfume-compendium"
Issues = "https://github.com/Scento-com/perfume-compendium/issues"

[project.scripts]
scento-perfume-compendium = "scento_perfume_compendium.proxy:main"

[tool.setuptools.packages.find]
where = ["src"]
