[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scento-perfume-compendium"
version = "1.0.0"
description = "Scento Perfume Compendium: the perfume knowledge connector for AI assistants. Perfume portraits, raw materials, houses and Scento's family map, every answer tied to a page on scento.com. No key, no account."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scento", email = "contact@scento.com" }]
keywords = ["perfume", "fragrance", "mcp", "model-context-protocol", "claude", "chatgpt", "perfume-notes", "scento"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://www.scento.com/developers"
Documentation = "https://www.scento.com/developers"
Website = "https://www.scento.com"
Repository = "https://github.com/Scento-com/perfume-compendium"
Issues = "https://github.com/Scento-com/perfume-compendium/issues"

[project.scripts]
scento-perfume-compendium = "scento_perfume_compendium.proxy:main"

[tool.setuptools.packages.find]
where = ["src"]
